syntax = "proto3";

package ai_service;

service AIService {
  rpc Chat(ChatRequest) returns (ChatResponse);
  rpc CreateRAG(CreateRAGRequest) returns (CreateRAGResponse);
  rpc HealthCheck(Empty) returns (HealthCheckResponse);
}

message ChatMessage {
  string role = 1;
  string content = 2;
}

message ChatRequest {
  repeated ChatMessage messages = 1;
  string project_id = 2;
}

// OpenAI ChatCompletion structure
message ChatCompletion {
  string id = 1;
  string object = 2;
  int64 created = 3;
  string model = 4;
  repeated Choice choices = 5;
  Usage usage = 6;
  string system_fingerprint = 7;  // Optional
}

message Choice {
  int32 index = 1;
  ChatCompletionMessage message = 2;
  string finish_reason = 3;
}

message ChatCompletionMessage {
  string role = 1;
  string content = 2;  // Optional, can be null
  repeated ToolCall tool_calls = 3;  // Optional
  string refusal = 4;  // Optional
}

message ToolCall {
  string id = 1;
  string type = 2;  // Usually "function"
  FunctionCall function = 3;
}

message FunctionCall {
  string name = 1;
  string arguments = 2;  // JSON string
}

message Usage {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  int32 total_tokens = 3;
}

message ChatResponse {
  // Original request for reference
  ChatRequest request = 1;
  
  // Full OpenAI ChatCompletion response as JSON string (simpler than manual serialization)
  string completion_json = 2;
  
  // Convenience field for backward compatibility
  string content = 3;
}

message Empty {}

message CreateRAGRequest {
  string project_id = 1;
}

message CreateRAGResponse {
  bool success = 1;
  string message = 2;
}

message HealthCheckResponse {
  bool isAlive = 1;
}
