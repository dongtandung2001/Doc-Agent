version: v2
# Managed mode helps maintain consistent Go package paths
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/dongtandung2001/Doc-Agent/backend/shared/gen
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
plugins:
  # Generate Go protobuf code using local protoc-gen-go
  - local: protoc-gen-go
    out: gen
    opt:
      - paths=source_relative

  # Generate gRPC code using local protoc-gen-go-grpc (for backend services)
  # Note: You'll also need to install this:
  # go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
  - local: protoc-gen-go-grpc
    out: gen
    opt:
      - paths=source_relative

  # Generate Connect-Go code using local protoc-gen-connect-go (for gateway)
  - local: protoc-gen-connect-go
    out: gen
    opt:
      - paths=source_relative