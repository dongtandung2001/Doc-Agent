syntax = "proto3";

package api.proto.v1;

import "api/proto/v1/common.proto";

option go_package = "github.com/dongtandung2001/Doc-Agent/backend/gen/api/proto/v1;apiv1";

// LocalAgentService - Interact with user codebase, Chat/Q&A
// Implemented in Rust for optimized I/O operations
service LocalAgentService {
  // Request file content on demand (used by Document Generation service)
  rpc RequestFileContent(RequestFileContentRequest) returns (RequestFileContentResponse);

  // Health check
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// RequestFileContent - Read files on request
message RequestFileContentRequest {
  repeated string paths = 1; // File path (e.g., ["base/cli/chat.rs"])
}

message RequestFileContentResponse {
  string content = 1; // File content as string
}
