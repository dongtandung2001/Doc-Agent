syntax = "proto3";

package api.proto.v1;

import "api/proto/v1/common.proto";

option go_package = "github.com/dongtandung2001/Doc-Agent/backend/gen/api/proto/v1;apiv1";

// AIService - LLM interactions (Python service)
// Handles chat, RAG, and embedding generation
service AIService {
  // Chat with AI assistant
  rpc Chat(ChatRequest) returns (ChatResponse);

  // Trigger RAG embedding pipeline for a project
  rpc CreateRAG(CreateRAGRequest) returns (CreateRAGResponse);

  // Health check
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// Chat request
message ChatRequest {
  repeated ChatMessage messages = 1; // Array of chat messages (role + content)
  string project_id = 2;             // Project identifier for RAG context
}

// Chat response
message ChatResponse {
  string content = 1; // AI-generated response
}

// CreateRAG request
message CreateRAGRequest {
  string project_id = 1; // Project identifier to embed documents for
}

// CreateRAG response
message CreateRAGResponse {
  bool success = 1;   // Whether embedding succeeded
  string message = 2; // Human-readable result or error message
}
