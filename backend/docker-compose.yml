services:
  # API Gateway
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - BACKENDS_CODEBASE_HOST=codebase
      - BACKENDS_CODEBASE_PORT=9001
      - BACKENDS_DATABASE_HOST=database
      - BACKENDS_DATABASE_PORT=9002
      - BACKENDS_LOCAL_AGENT_HOST=${LOCAL_AGENT_HOST:-host.docker.internal}
      - BACKENDS_LOCAL_AGENT_PORT=${LOCAL_AGENT_PORT:-50051}
      - BACKENDS_AI_HOST=ai-service
      - BACKENDS_AI_PORT=50051
    depends_on:
      - codebase
      - ai-service
      # - database
    networks:
      - doc-agent-network

  # Codebase Analysis Service
  codebase:
    build:
      context: .
      dockerfile: services/codebase/Dockerfile
    ports:
      - "9001:9001"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=9001
      - CHAT_API_URL=${CHAT_API_URL}
      - CHAT_API_KEY=${CHAT_API_KEY}
      - CHAT_MODEL=${CHAT_MODEL}
      - GATEWAY_HOST=gateway
      - GATEWAY_PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_HOST=database
      - DATABASE_PORT=9002
      - CACHE_STATS_FILE=/app/logs/cache_stats.json
    volumes:
      - ./logs/codebase:/app/logs
    depends_on:
      - redis
      - database
    networks:
      - doc-agent-network

  # Document Generation Worker (consumes from MQ)
  docgen:
    build:
      context: .
      dockerfile: services/docgen/Dockerfile
    environment:
      - CHAT_API_URL=${CHAT_API_URL}
      - CHAT_API_KEY=${CHAT_API_KEY}
      - CHAT_MODEL=${CHAT_MODEL}
      - GATEWAY_HOST=gateway
      - GATEWAY_PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_HOST=database
      - DATABASE_PORT=9002
      - CACHE_STATS_FILE=/app/logs/cache_stats.json
    volumes:
      - ./generated_docs:/app/generated_docs
      - ./logs/docgen:/app/logs
    depends_on:
      - gateway
      - redis
      - database
    networks:
      - doc-agent-network

  # Database Service
  database:
    build:
      context: .
      dockerfile: services/database/Dockerfile
    ports:
      - "9002:9002"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=9002
      - DATABASE_POSTGRES_URL=postgres://user:password@postgres:5432/docagent?sslmode=disable
      - DATABASE_VECTOR_DB_URL=http://vector-db:8000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - doc-agent-network

  # Redis for Task Queue
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - doc-agent-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AI Service (Python gRPC)
  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    ports:
      - "50051:50051"
    environment:
      # gRPC
      - GRPC_PORT=50051
      # LLM
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.7}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-2000}
      # DeepSeek (OpenAI-compatible, optional)
      - DEEPSEEK_API_KEY=sk-0a15119dfaf14a39b254d103c3a9f506
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      # Vector DB (ChromaDB embedded)
      - VECTOR_DB_PATH=/app/data/chroma_db
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - TOP_K_RETRIEVAL=${TOP_K_RETRIEVAL:-5}
      # RAG
      - RAG_CHUNK_SIZE=${RAG_CHUNK_SIZE:-1000}
      - RAG_CHUNK_OVERLAP=${RAG_CHUNK_OVERLAP:-200}
      - RETRIEVAL_SCORE_THRESHOLD=${RETRIEVAL_SCORE_THRESHOLD:-1.2}
      # PostgreSQL (for embedding pipeline)
      - DATABASE_POSTGRES_URL=postgres://user:password@postgres:5432/docagent?sslmode=disable
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ai-chroma-data:/app/data/chroma_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - doc-agent-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=docagent
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - doc-agent-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d docagent"]
      interval: 5s
      timeout: 5s
      retries: 10
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_ui
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=password123
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "5050:80"
    networks:
      - doc-agent-network
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

networks:
  doc-agent-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  pgadmin-data:
  ai-chroma-data:
