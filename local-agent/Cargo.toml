[package]
name = "local-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI & Terminal
clap = { version = "4", features = ["derive"] }
rustyline = "17.0.2"
crossterm = "0.29.0"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
eyre = "0.6"
thiserror = "2.0.17"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# HTTP client
reqwest = { version = "0.12.24", features = ["json", "stream"] }

# Async utilities
async-trait = "0.1"
futures = "0.3"

[dev-dependencies]
tokio-test = "0.4"
