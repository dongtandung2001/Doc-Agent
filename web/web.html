    <script id="tailwind-config">

                            Hello! I'm your documentation assistant. Ask me anything about this project's docs.
                        </div>

            <div class="p-4 bg-white border-t border-slate-200">

                    class="relative flex items-end gap-2 bg-slate-50 border border-slate-200 rounded-xl p-2 shadow-sm focus-within:ring-2 focus-within:ring-primary/20 focus-within:border-primary transition-all">
                    <button
                        class="p-2 text-slate-400 hover:text-primary rounded-lg transition-colors h-10 w-10 flex items-center justify-center shrink-0">
                        <span class="material-symbols-outlined text-[20px]">add_circle</span>
                    </button>
                    <textarea id="chat-input"
                        class="w-full bg-transparent border-none focus:ring-0 text-sm text-slate-900 placeholder:text-slate-400 resize-none py-2.5 max-h-32"
                        placeholder="Ask a question about this doc..." rows="1"></textarea>
                    <button type="button" id="chat-send"
                        class="p-2 bg-primary text-white rounded-lg hover:bg-blue-700 transition-colors shadow-sm h-10 w-10 flex items-center justify-center shrink-0">
                        <span class="material-symbols-outlined text-[20px]">arrow_upward</span>
                    </button>
                </div>

        </aside>

    <script>
(function () {
    // --- Config: point at your gateway (e.g. http://localhost:8080 when running backend)
    if (typeof marked !== 'undefined') {
        marked.setOptions({ headerIds: true, mangle: false, gfm: true, breaks: true });
    }
    var API_BASE = window.DOC_AGENT_API_BASE || 'http://localhost:8080';
    var params = new URLSearchParams(window.location.search);
    var projectId = params.get('project_id') || 'default';
    var fileParam = params.get('file'); // e.g. ?file=test.md to load and render a local .md file

    var gatewayPath = '/api.proto.v1.GatewayService';

    // Initialize Mermaid (for ```mermaid``` code blocks in markdown)
    if (window.mermaid) {
        mermaid.initialize({ startOnLoad: false, theme: 'default' });
    }

    function connectCall(method, body) {
        var url = API_BASE + gatewayPath + '/' + method;
        return fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify(body)
        }).then(function (r) {
            if (!r.ok) throw new Error('API ' + r.status + ': ' + r.statusText);
            return r.json();
        });
    }

    // --- TOC (GetDocumentSections)
    var tocNav = document.getElementById('toc-nav');
    var tocLoading = document.getElementById('toc-loading');
    var sections = [];
    var selectedDocumentId = null;

    function iconForTitle(title) {
        var t = (title || '').toLowerCase();
        if (t.includes('start') || t.includes('intro')) return 'rocket_launch';
        if (t.includes('auth') || t.includes('key')) return 'lock';
        if (t.includes('endpoint') || t.includes('api')) return 'list';
        if (t.includes('error')) return 'warning';
        if (t.includes('webhook')) return 'webhook';
        if (t.includes('deploy')) return 'cloud_upload';
        if (t.includes('config')) return 'settings';
        return 'description';
    }

    function renderTocSection(section, depth) {
        var url = section.url || '';
        var title = section.title || 'Untitled';
        var isActive = selectedDocumentId === url;
        var div = document.createElement('div');
        div.className = depth > 0 ? 'ml-3 mt-1' : '';
        var link = document.createElement('a');
        link.href = '#';
        link.dataset.documentId = url;
        link.className = 'flex items-center gap-2 px-3 py-2 text-sm font-medium rounded-lg group ' +
            (isActive ? 'text-primary bg-primary-light/50 border-l-2 border-primary' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900');
        link.innerHTML = '<span class="material-symbols-outlined text-[18px] ' + (isActive ? 'text-primary' : 'text-slate-400 group-hover:text-slate-600') + '">' + iconForTitle(title) + '</span> ' + escapeHtml(title);
        link.addEventListener('click', function (e) {
            e.preventDefault();
            if (url) selectAndLoadDocument(title);
        });
        div.appendChild(link);
        if (section.children && section.children.length) {
            var ul = document.createElement('ul');
            ul.className = 'space-y-0.5 mt-0.5';
            section.children.forEach(function (child) {
                var li = document.createElement('li');
                li.appendChild(renderTocSection(child, depth + 1));
                ul.appendChild(li);
            });
            div.appendChild(ul);
        }
        return div;
    }

    function escapeHtml(s) {
        var div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
    }

    // Transform ```mermaid``` code blocks into rendered diagrams
    function renderMermaid(root) {
        if (!window.mermaid) return;

        var codeBlocks = root.querySelectorAll('pre code.language-mermaid, code.language-mermaid');
        if (!codeBlocks.length) return;

        codeBlocks.forEach(function (codeEl) {
            var parent = codeEl.parentElement;
            var text = codeEl.textContent;
            var container = document.createElement('div');
            container.className = 'mermaid';
            container.textContent = text;

            if (parent && parent.tagName && parent.tagName.toLowerCase() === 'pre') {
                parent.replaceWith(container);
            } else {
                codeEl.replaceWith(container);
            }
        });

        try {
            if (typeof mermaid.run === 'function') {
                mermaid.run({ nodes: root.querySelectorAll('.mermaid') });
            } else if (typeof mermaid.init === 'function') {
                mermaid.init(undefined, root.querySelectorAll('.mermaid'));
            }
        } catch (e) {
            console.error('Mermaid render error', e);
        }
    }

    function selectAndLoadDocument(documentId) {
        selectedDocumentId = documentId;
        // Update TOC active state
        tocNav.querySelectorAll('a[data-document-id]').forEach(function (a) {
            var active = a.dataset.documentId === documentId;
            a.className = 'flex items-center gap-2 px-3 py-2 text-sm font-medium rounded-lg group ' +
                (active ? 'text-primary bg-primary-light/50 border-l-2 border-primary' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900');
            var icon = a.querySelector('.material-symbols-outlined');
            if (icon) icon.className = 'material-symbols-outlined text-[18px] ' + (active ? 'text-primary' : 'text-slate-400 group-hover:text-slate-600');
        });
        loadDocument(documentId);
    }

    function loadSections() {
        connectCall('GetDocumentSections', { projectId: "1" })
            .then(function (data) {
                tocLoading.style.display = 'none';
                sections = data.sections || [];
                if (sections.length === 0) {
                    tocNav.innerHTML = '<div class="px-3 py-4 text-sm text-slate-500">No sections for this project.</div>';
                    return;
                }
                var container = document.createElement('div');
                container.className = 'space-y-1';
                sections.forEach(function (section) {
                    container.appendChild(renderTocSection(section, 0));
                });
                tocNav.innerHTML = '';
                tocNav.appendChild(container);
                // Default: load first section (first leaf or first section with url)
                var first = firstSectionUrl(sections);
                if (first) selectAndLoadDocument(first);
            })
            .catch(function (err) {
                tocLoading.textContent = 'Failed to load TOC: ' + (err.message || String(err));
                tocLoading.classList.add('text-red-600');
            });
    }

    function firstSectionUrl(sectionList) {
        for (var i = 0; i < sectionList.length; i++) {
            var s = sectionList[i];
            if (s.url) return s.url;
            if (s.children && s.children.length) {
                var child = firstSectionUrl(s.children);
                if (child) return child;
            }
        }
        return null;
    }

    // --- Local file mode: fetch a .md file and render it (no backend required)
    function slugFromTitle(title) {
        return (title || '').toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
    }

    function buildTocFromMarkdown(md) {
        var sections = [];
        var lines = md.split('\n');
        var stack = [{ children: sections, depth: 0, path: [] }];
        var usedIds = {};
        for (var i = 0; i < lines.length; i++) {
            var line = lines[i];
            var m = line.match(/^(#{1,6})\s+(.+)$/);
            if (!m) continue;
            var depth = m[1].length;
            var title = m[2].trim();
            var slug = slugFromTitle(title);
            while (stack.length > 1 && stack[stack.length - 1].depth >= depth) stack.pop();
            var parentPath = stack[stack.length - 1].path;
            var segment = slug;
            var fullId = parentPath.length ? parentPath.join('-') + '-' + segment : segment;
            if (usedIds[fullId]) {
                usedIds[fullId]++;
                segment = slug + '-' + usedIds[fullId];
                fullId = parentPath.length ? parentPath.join('-') + '-' + segment : segment;
            } else {
                usedIds[fullId] = 1;
            }
            var node = { title: title, url: '#' + fullId, children: [] };
            stack[stack.length - 1].children.push(node);
            stack.push({ children: node.children, depth: depth, path: parentPath.concat([segment]) });
        }
        return sections;
    }

    function loadLocalFile(filename) {
        docContent.innerHTML = '<div class="py-8 text-center text-slate-500">Loading…</div>';
        tocLoading.style.display = 'block';
        tocLoading.textContent = 'Loading…';
        fetch(filename)
            .then(function (r) {
                if (!r.ok) throw new Error('Failed to load ' + filename + ': ' + r.status);
                return r.text();
            })
            .then(function (md) {
                tocLoading.style.display = 'none';
                var sections = buildTocFromMarkdown(md);
                if (sections.length > 0) {
                    var container = document.createElement('div');
                    container.className = 'space-y-1';
                    sections.forEach(function (section) {
                        container.appendChild(renderTocSection(section, 0));
                    });
                    tocNav.innerHTML = '';
                    tocNav.appendChild(container);
                } else {
                    tocNav.innerHTML = '<div class="px-3 py-4 text-sm text-slate-500">No headings in document.</div>';
                }
                var html = typeof marked !== 'undefined' ? marked.parse(md) : escapeHtml(md).replace(/\n/g, '<br>');
                docContent.innerHTML = '<div class="prose prose-slate max-w-none">' + html + '</div>';
                enhanceRenderedContent(docContent);
                breadcrumb.textContent = '';
                var span = document.createElement('span');
                span.className = 'font-medium text-slate-900';
                span.textContent = filename;
                breadcrumb.appendChild(span);
            })
            .catch(function (err) {
                tocLoading.style.display = 'none';
                tocNav.innerHTML = '<div class="px-3 py-4 text-sm text-red-600">Failed to load TOC.</div>';
                docContent.innerHTML = '<div class="p-4 rounded-lg bg-red-50 text-red-700 text-sm">Failed to load file: ' + escapeHtml(err.message || String(err)) + '</div>';
            });
    }

    // --- Main content (GetDocument)
    var docContent = document.getElementById('doc-content');
    var breadcrumb = document.getElementById('breadcrumb');

    function enhanceRenderedContent(container) {
        if (!container) return;
        var prose = container.querySelector('.prose');
        if (!prose) return;
        // Apply heading ids that match TOC links (hierarchical path + slug for uniqueness)
        var usedIds = {};
        var pathStack = [];
        prose.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(function (heading) {
            var depth = parseInt(heading.tagName.charAt(1), 10);
            var text = heading.textContent.trim();
            if (!text) return;
            while (pathStack.length > 0 && pathStack[pathStack.length - 1].depth >= depth) pathStack.pop();
            var parentPath = pathStack.length ? pathStack[pathStack.length - 1].path : [];
            var slug = slugFromTitle(text);
            var segment = slug;
            var fullId = parentPath.length ? parentPath.join('-') + '-' + segment : segment;
            if (usedIds[fullId]) {
                usedIds[fullId]++;
                segment = slug + '-' + usedIds[fullId];
                fullId = parentPath.length ? parentPath.join('-') + '-' + segment : segment;
            } else {
                usedIds[fullId] = 1;
            }
            heading.id = fullId;
            pathStack.push({ depth: depth, path: parentPath.concat([segment]) });
        });
        if (typeof hljs !== 'undefined') {
            prose.querySelectorAll('pre code:not(.language-mermaid)').forEach(function (block) {
                hljs.highlightElement(block);
            });
        }
        var mermaidBlocks = prose.querySelectorAll('pre code.language-mermaid');
        if (typeof mermaid !== 'undefined' && mermaidBlocks.length > 0) {
            if (!window._mermaidInited) {
                mermaid.initialize({ startOnLoad: false });
                window._mermaidInited = true;
            }
            mermaidBlocks.forEach(function (code) {
                var pre = code.closest('pre');
                var div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = code.textContent;
                pre.parentNode.replaceChild(div, pre);
            });
            mermaid.run({ nodes: prose.querySelectorAll('.mermaid') }).catch(function (e) { console.warn('Mermaid:', e); });
        }
    }

    function loadDocument(documentId) {
        if (fileParam && documentId && documentId.charAt(0) === '#') {
            var el = document.getElementById(documentId.slice(1));
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            return;
        }
        docContent.innerHTML = '<div class="py-8 text-center text-slate-500">Loading…</div>';
        connectCall('GetDocument', { projectId: "1", documentId: documentId })
            .then(function (data) {
                console.log("error getting document", documentId, data);
                var errMsg = data.errorMsg || data.error_msg;
                if (errMsg) {
                    docContent.innerHTML = '<div class="p-4 rounded-lg bg-red-50 text-red-700 text-sm">' + escapeHtml(errMsg) + '</div>';
                    return;
                }
                var doc = data.doc || '';
                if (typeof marked !== 'undefined') {
                    docContent.innerHTML = '<div class="prose prose-slate max-w-none">' + marked.parse(doc) + '</div>';
                    enhanceRenderedContent(docContent);
                } else {
                    docContent.innerHTML = '<pre class="text-sm text-slate-700 whitespace-pre-wrap font-sans">' + escapeHtml(doc) + '</pre>';
                }

                // After markdown is rendered, upgrade any ```mermaid``` blocks to diagrams
                renderMermaid(docContent);
                breadcrumb.textContent = '';
                var span = document.createElement('span');
                span.className = 'font-medium text-slate-900';
                span.textContent = documentId || 'Document';
                breadcrumb.appendChild(span);
            })
            .catch(function (err) {
                docContent.innerHTML = '<div class="p-4 rounded-lg bg-red-50 text-red-700 text-sm">Failed to load document: ' + escapeHtml(err.message || String(err)) + '</div>';
            });
    }

    // --- Chat (Chat API)
    var chatMessages = document.getElementById('chat-messages');
    var chatWelcome = document.getElementById('chat-welcome');
    var chatInput = document.getElementById('chat-input');
    var chatSend = document.getElementById('chat-send');
    var chatClear = document.getElementById('chat-clear');
    var chatHistory = [];

    function appendMessage(role, content) {
        var isUser = role === 'user';
        var wrap = document.createElement('div');
        wrap.className = 'flex gap-3' + (isUser ? ' flex-row-reverse' : '');
        var avatar = document.createElement('div');
        avatar.className = 'size-8 rounded-full flex-shrink-0 flex items-center justify-center mt-1 ' + (isUser ? 'bg-slate-200 text-slate-500' : 'bg-indigo-100 text-indigo-600');
        if (isUser) {
            avatar.innerHTML = '<span class="text-sm font-medium">You</span>';
        } else {
            avatar.innerHTML = '<span class="material-symbols-outlined text-[16px]">smart_toy</span>';
        }
        var col = document.createElement('div');
        col.className = 'flex flex-col gap-1 max-w-[85%]' + (isUser ? ' items-end' : '');
        var label = document.createElement('span');
        label.className = 'text-xs font-bold text-slate-500 ' + (isUser ? 'mr-1' : 'ml-1');
        label.textContent = isUser ? 'You' : 'Assistant';
        var bubble = document.createElement('div');
        bubble.className = (isUser ? 'bg-primary text-white' : 'bg-white border border-slate-200') + ' p-3 rounded-2xl shadow-sm text-sm leading-relaxed ' + (isUser ? 'rounded-tr-none' : 'rounded-tl-none');
        bubble.innerHTML = typeof content === 'string' ? escapeHtml(content).replace(/\n/g, '<br>') : content;
        col.appendChild(label);
        col.appendChild(bubble);
        wrap.appendChild(avatar);
        wrap.appendChild(col);
        chatMessages.appendChild(wrap);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function setChatLoading(loading) {
        chatSend.disabled = loading;
        chatSend.querySelector('.material-symbols-outlined').textContent = loading ? 'hourglass_empty' : 'arrow_upward';
    }

    function sendChatMessage() {
        var text = (chatInput.value || '').trim();
        if (!text) return;
        chatInput.value = '';
        chatHistory.push({ role: 'user', content: text });
        appendMessage('user', text);
        setChatLoading(true);
        var messages = chatHistory.map(function (m) { return { role: m.role, content: m.content }; });
        connectCall('Chat', { messages: messages, projectId: projectId })
            .then(function (data) {
                var content = (data && data.content) ? data.content : 'No response.';
                chatHistory.push({ role: 'assistant', content: content });
                appendMessage('assistant', content);
            })
            .catch(function (err) {
                appendMessage('assistant', 'Error: ' + (err.message || String(err)));
            })
            .finally(function () { setChatLoading(false); });
    }

    chatSend.addEventListener('click', sendChatMessage);
    chatInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatMessage(); }
    });
    function getWelcomeEl() {
        var w = document.createElement('div');
        w.className = 'flex gap-3';
        w.id = 'chat-welcome';
        w.innerHTML = '<div class="size-8 rounded-full bg-indigo-100 flex-shrink-0 flex items-center justify-center text-indigo-600 mt-1"><span class="material-symbols-outlined text-[16px]">smart_toy</span></div><div class="flex flex-col gap-1 max-w-[85%]"><span class="text-xs font-bold text-slate-500 ml-1">Assistant</span><div class="bg-white border border-slate-200 p-3 rounded-2xl rounded-tl-none shadow-sm text-sm text-slate-700 leading-relaxed">Hello! I\'m your documentation assistant. Ask me anything about this project\'s docs.</div></div>';
        return w;
    }
    chatClear.addEventListener('click', function () {
        chatHistory = [];
        while (chatMessages.lastChild) chatMessages.removeChild(chatMessages.lastChild);
        chatMessages.appendChild(getWelcomeEl());
    });

    // --- Init
    if (fileParam) {
        loadLocalFile(fileParam);
    } else {
        loadSections();
    }
})();
    </script>
</body>

</html>
